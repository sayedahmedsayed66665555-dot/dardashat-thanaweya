*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b141a;
  color:#fff;
}

.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  background:#111b21;
  position:relative;
  padding-bottom:75px;
}

/* الهيدر */
header{
  background:#202c33;
  padding:18px 16px 12px;
  position:sticky;
  top:0;
  z-index:10;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#25d366;
  color:#071b12;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
}

.title{
  flex:1;
  margin-right:12px;
}

.title h1{
  margin:0;
  font-size:21px;
}

.title p{
  margin:4px 0 0;
  color:#aebac1;
  font-size:13px;
}

.search{
  margin-top:14px;
  background:#2a3942;
  border-radius:10px;
  padding:10px 14px;
  color:#aebac1;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:15px;
  text-align:right;
}

/* المحتوى */
.content{
  padding:8px 0;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.section-title{
  padding:14px 18px 8px;
  color:#25d366;
  font-size:15px;
  font-weight:bold;
}
